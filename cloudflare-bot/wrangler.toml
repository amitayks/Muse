name = "content-bot"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# NOTE: Image rendering (Satori/resvg) lives in the separate `render-worker`, reached via the
# RENDER service binding below — so this Worker no longer bundles satori and the old
# [define] process.env shims it required are gone. See ../render-worker and DEPLOY.md.

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "content-bot-db"
database_id = "4bd535da-8924-4bf2-bb50-19d25f483236"

# R2 Storage binding
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "content-bot-images"

# Service binding to the render-worker (Satori/resvg image rendering).
# Kept in a separate Worker so this bundle excludes the ~3.4 MB image stack and
# cold-starts fast on the conversational path. Deploy render-worker before/independently;
# the binding resolves by name, so only image calls fail if it's missing.
[[services]]
binding = "RENDER"
service = "render-worker"
entrypoint = "RenderService"

# Cron triggers.
#   */15 * * * * — the per-user coordinator (poll, publish scheduled drafts, refresh tokens, …).
#   *   * * * * — the deferred X video-post processor only (core/x-pending.ts). An X video media
#                 object needs ~10-60s after upload before POST /2/tweets accepts it ("Your media
#                 IDs are invalid" otherwise); the publish flow uploads inline, enqueues a row in
#                 x_pending_posts, and this minute tick retries the tweet-creation until it works.
#                 index.ts scheduled() dispatches on event.cron so this tick never runs the
#                 heavy 15-min coordinator.
[triggers]
crons = ["*/15 * * * *", "* * * * *"]

# Durable Object migrations.
# v1: an earlier (aborted) container deploy registered the VideoTranscoder DO class on the
#     account. v2: delete it — video normalization moved to client-side ffmpeg.wasm, so the
#     class no longer exists in code. Deleting a DO class requires an explicit delete-class
#     migration (removing the code alone fails deploy with "depended on by existing Durable
#     Objects"). After this lands cleanly the whole [[migrations]] block can be dropped.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VideoTranscoder"]

[[migrations]]
tag = "v2"
deleted_classes = ["VideoTranscoder"]

# ===========================================
# SECRETS CONFIGURATION (set via wrangler secret put)
# ===========================================
# Shared infrastructure secrets (required):
#   - TELEGRAM_BOT_TOKEN: Telegram bot token from @BotFather
#   - TELEGRAM_CHAT_ID: Admin's Telegram user ID (copied to ADMIN_CHAT_ID at runtime)
#   - ENCRYPTION_KEY: 32-byte base64 key for AES-256-GCM user key encryption
#                     Generate with: openssl rand -base64 32
#   - ADMIN_SECRET: Secret for protecting /setup and /migrate endpoints
#                   Generate with: openssl rand -hex 32
#   - WORKER_URL: Full URL of this worker (e.g., https://content-bot.your-subdomain.workers.dev)
#                 Required for cron fan-out and webhook URL creation
#
# Optional:
#   - MAX_USERS: Max registered users (default: 50)
#
# X OAuth 2.0 (PKCE public client) — app-level connect flow config:
#   - X_OAUTH2_CLIENT_ID, X_OAUTH2_REDIRECT_URI
#
# LinkedIn OAuth 2.0 (CONFIDENTIAL client) — app-level connect flow config:
#   - LINKEDIN_CLIENT_ID: the LinkedIn app's Client ID
#   - LINKEDIN_REDIRECT_URI: must exactly match the redirect URL registered with LinkedIn;
#                            its path is the callback route (e.g. https://<worker>/linkedin/oauth/callback)
#   - LINKEDIN_CLIENT_SECRET: the LinkedIn app's Client Secret (set via `wrangler secret put` —
#                             confidential client, required in the token exchange; NEVER per-user)
#   Provision a LinkedIn app with the "Sign In with LinkedIn using OpenID Connect" + "Share on
#   LinkedIn" products and programmatic refresh tokens enabled.
#
# REMOVED (no longer needed — per-user webhook secrets stored in D1):
#   - GITHUB_OWNER (was: GitHub org/user for commit search)
#   - GITHUB_WEBHOOK_SECRET (was: shared webhook signing secret)
#
#   - WEBAPP_URL: URL of the React webapp on Cloudflare Pages
#                 (e.g., https://musepost-webapp.pages.dev)
#                 When set, enables "Open App" button on home and webapp-based
#                 draft editing. When empty, bot falls back to message-based editing.
#
# NOTE: Per-user API keys (X, Gemini, GitHub, HeyGen) are stored
# encrypted in D1, NOT as Worker secrets. Users provide keys via
# the onboarding flow or Settings > API Keys.
# GitHub webhook secrets are auto-generated per repo and stored in the repos table.
